name: Analyze

on:
  pull_request:

defaults:
  run:
    working-directory: fera_metalurgica_app

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (freezed / json_serializable / riverpod_generator)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test
